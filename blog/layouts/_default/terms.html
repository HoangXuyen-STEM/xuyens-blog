{{ define "main" }}
<section class="terms-page container">
    <header class="terms-header">
        <h1 class="terms-title">Tất cả {{ .Title }}</h1>
    </header>

    <ul class="terms-list">
        {{ range .Data.Terms.ByCount }}
        <li>
            <a href="{{ .Page.RelPermalink }}" class="term-link">
                {{ .Page.Title }} <span class="term-count">({{ .Count }})</span>
            </a>
        </li>
        {{ end }}
    </ul>
</section>
{{ end }}
