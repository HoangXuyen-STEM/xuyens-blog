<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary }}{{ end }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>
        <link rel="canonical" href="{{ .Permalink }}" />
        <meta name="robots" content="index, follow" />

        <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}" />
        <meta property="og:url" content="{{ .Permalink }}" />
        <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}" />
        <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | truncate 160 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}" />
        <meta property="og:image" content="{{ with .Params.thumbnail }}{{ . | absURL }}{{ else }}{{ "images/og-default.png" | absURL }}{{ end }}" />
        <meta property="og:locale" content="vi_VN" />
        <meta property="og:site_name" content="{{ .Site.Title }}" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}" />
        <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | truncate 160 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}" />
        <meta name="twitter:image" content="{{ with .Params.thumbnail }}{{ . | absURL }}{{ else }}{{ "images/og-default.png" | absURL }}{{ end }}" />

        {{ if and (not .IsHome) (eq .Section "posts") }}
        <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Article",
    "headline": "{{ .Title }}",
    "description": "{{ with .Description }}{{ . }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}",
    "image": "{{ with .Params.thumbnail }}{{ . | absURL }}{{ else }}{{ "images/og-default.png" | absURL }}{{ end }}",
    "author": {
        "@type": "Person",
        "name": "Hoàng Xuyên",
        "url": "{{ .Site.BaseURL }}"
    },
    "publisher": {
        "@type": "Organization",
        "name": "XuyenLab",
        "logo": {
            "@type": "ImageObject",
            "url": "{{ "images/logo.png" | absURL }}"
        }
    },
    "datePublished": "{{ .Date.Format "2006-01-02" }}",
    "dateModified": "{{ .Lastmod.Format "2006-01-02" }}",
    "url": "{{ .Permalink }}"
}
        </script>
        {{ end }}

        {{ if .IsHome }}
        <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Hoàng Xuyên",
    "jobTitle": "AI Trainer & STEM Coordinator",
    "description": "Giáo viên Hóa học, AI Trainer, CAIO for Educators tại Đắk Lắk, Việt Nam",
    "url": "{{ .Site.BaseURL }}",
    "sameAs": [
        "https://www.facebook.com/xuyen.hoang.731",
        "https://www.linkedin.com/in/do-xuyen-271825205"
    ],
    "knowsAbout": ["AI Education", "Prompt Engineering", "STEM", "Chemistry Teaching"]
}
        </script>
        {{ end }}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=2">
</head>

<body>
    {{- partial "nav.html" . -}}

    <main class="container">
        {{- block "main" . }}{{- end }}
    </main>

    {{- partial "footer.html" . -}}
    <script src="/js/newsletter.js"></script>
</body>

</html>
