version: '3.8'

services:
  blog:
    build: .
    container_name: xuyens-blog
    restart: unless-stopped
    ports:
      - "2368:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    networks:
      - blog-network
    labels:
      - "com.xuyenlab.service=blog"
      - "com.xuyenlab.description=Xuyen's Blog - Hugo Static Site"

networks:
  blog-network:
    driver: bridge
